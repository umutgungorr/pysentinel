[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysentinel"
version = "0.1.0"
description = "Zero-dependency, high-precision Python security linter with SARIF support"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Umut Güngör", email = "umutgungor.dev@gmail.com" }
]
keywords = ["security", "linter", "sast", "ast", "sarif", "vulnerabilities", "appsec"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
pysentinel = "pysentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pysentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
